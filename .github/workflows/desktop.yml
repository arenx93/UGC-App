# Builds the Framecraft desktop installers on real macOS and Windows machines.
# Download them from the run's "Artifacts" section (Actions tab → this workflow).
# Pushing a tag like v1.0.0 also attaches them to a draft GitHub Release.
name: Desktop apps

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "app/**"
      - "components/**"
      - "db/**"
      - "desktop/**"
      - "drizzle/**"
      - "lib/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "electron-builder.yml"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            script: desktop:mac:arm64
            artifact: Framecraft-macOS-AppleSilicon
            files: release/*.dmg
          - name: macOS (Intel)
            os: macos-15-intel
            script: desktop:mac:x64
            artifact: Framecraft-macOS-Intel
            files: release/*.dmg
          - name: Windows
            os: windows-latest
            script: desktop:win
            artifact: Framecraft-Windows
            files: release/*.exe
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build installer
        run: npm run ${{ matrix.script }}

      - name: Smoke test (launch the app and load the studio)
        run: npx electron . --smoke-test
        timeout-minutes: 5

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.files }}
