# Native Windows app (C++ / WinUI 3): core tests, build, launch check, screenshots and package.
# Download it from the run's "Artifacts" (Framecraft-Windows-C++).
name: Windows app (C++)

on:
  push:
    branches: ["**"]
    paths:
      - "windows/**"
      - "macos/Sources/FramecraftCore/Resources/**"
      - ".github/workflows/windows-native.yml"
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Commit screenshots to docs/windows"
        type: boolean
        default: false
      release:
        description: "Publish a Release with this version (e.g. 1.0.0); empty = no release"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the portable core
        run: |
          cmake -S windows/core -B build-core -DCMAKE_BUILD_TYPE=Release
          cmake --build build-core -j4
          ctest --test-dir build-core --output-on-failure
          # Again with AddressSanitizer + UBSan to catch memory bugs early.
          cmake -S windows/core -B build-asan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-asan -j4
          ctest --test-dir build-asan --output-on-failure

  build:
    name: Build, test & package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2

      - name: Toolchain
        shell: pwsh
        run: |
          msbuild -version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property catalog_productDisplayVersion
          [System.Environment]::OSVersion.Version

      - name: Core tests (MSVC)
        shell: pwsh
        run: |
          cmake -S windows/core -B build-core
          cmake --build build-core --config Release
          ctest --test-dir build-core -C Release --output-on-failure

      - name: Restore NuGet packages
        run: nuget restore windows\app\packages.config -PackagesDirectory windows\packages

      - name: Build Framecraft.exe
        shell: pwsh
        run: msbuild windows\app\Framecraft.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:m /nologo

      - name: Bundle Codex CLI and the C++ runtime
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          windows\scripts\fetch-codex.ps1 -Destination windows\build\Release\codex.exe
          # App-local Visual C++ runtime, so no redistributable installer is needed.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory | Sort-Object Name -Descending |
            ForEach-Object { Get-ChildItem (Join-Path $_.FullName "x64") -Directory -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if (-not $crt) { Write-Error "Visual C++ runtime not found"; exit 1 }
          Copy-Item (Join-Path $crt.FullName "*.dll") windows\build\Release\ -Force
          Get-ChildItem windows\build\Release -Filter "*140*.dll" | Select-Object Name

      - name: Output
        shell: pwsh
        run: Get-ChildItem windows\build\Release | Select-Object Name, Length | Format-Table -AutoSize

      - name: Launch check
        shell: pwsh
        run: |
          $exe = Resolve-Path windows\build\Release\Framecraft.exe
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Error "Framecraft exited during launch (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Host "Framecraft launched and stayed running"

      - name: Screenshots (demo data)
        shell: pwsh
        run: |
          $shots = Join-Path $env:RUNNER_TEMP "shots"
          New-Item -ItemType Directory -Force $shots | Out-Null
          $p = Start-Process -FilePath (Resolve-Path windows\build\Release\Framecraft.exe) -ArgumentList "--snapshot", "`"$shots`"" -PassThru
          if (-not $p.WaitForExit(240000)) { Stop-Process -Id $p.Id -Force; Write-Warning "Snapshot run timed out" }
          Get-ChildItem $shots | Select-Object Name, Length | Format-Table -AutoSize
          if ((Get-ChildItem $shots -Filter *.png).Count -lt 5) { Write-Error "Too few screenshots"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: Framecraft-Windows-screenshots
          path: ${{ runner.temp }}/shots/*.png
          retention-days: 14

      - name: Commit screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force docs\windows | Out-Null
          Copy-Item "$env:RUNNER_TEMP\shots\*.png" docs\windows\ -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/windows
          git commit -m "Update Windows screenshots"
          if ($LASTEXITCODE -ne 0) { exit 0 }
          git pull --rebase origin "$env:GITHUB_REF_NAME"
          git push origin "HEAD:$env:GITHUB_REF_NAME"

      - name: Version
        id: version
        shell: pwsh
        run: |
          $release = "${{ inputs.release }}"
          $version = if ($release) { $release } else { "1.0.${{ github.run_number }}" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Package (zip + installer)
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force windows\dist | Out-Null
          Get-ChildItem windows\build\Release -Include *.pdb,*.lib,*.exp,*.ilk -Recurse | Remove-Item -Force
          Compress-Archive -Path windows\build\Release\* -DestinationPath "windows\dist\Framecraft-$version-Windows-x64.zip" -Force
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=$version" "/DSourceDir=..\build\Release" windows\installer\Framecraft.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "Inno Setup failed"; exit 1 }
          Get-ChildItem windows\dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Framecraft-Windows-C++
          path: windows/dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-v${{ inputs.release }}
          target_commitish: ${{ github.sha }}
          name: Framecraft para Windows win-v${{ inputs.release }}
          body: |
            App nativa para Windows 10 (1809) y Windows 11, escrita en C++ con WinUI 3.

            **Instalar:** descargá `Framecraft-Setup-${{ inputs.release }}.exe` y abrilo (no pide permisos de administrador). También está el `.zip` portable: descomprimilo y abrí `Framecraft.exe`.

            **Primera apertura:** Windows SmartScreen puede avisar porque el instalador todavía no está firmado: tocá **Más información → Ejecutar de todas formas**.

            Guía completa en el [README de Windows](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/windows/README.md).
          files: |
            windows/dist/*.exe
            windows/dist/*.zip
          fail_on_unmatched_files: true
