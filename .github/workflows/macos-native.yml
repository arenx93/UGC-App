# Native macOS app (Swift / SwiftUI): tests, universal build, DMG and screenshots.
# Download the DMG from the run's "Artifacts" (Framecraft-macOS).
# Run it manually with "screenshots" checked to commit fresh screenshots to docs/macos/.
name: macOS app (Swift)

on:
  push:
    branches: ["**"]
    tags: ["mac-v*"]
    paths:
      - "macos/**"
      - ".github/workflows/macos-native.yml"
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Commit screenshots to docs/macos"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test & package
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Unit tests (core)
        run: swift test

      - name: Download Codex CLI (bundled for ChatGPT sign-in)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          scripts/fetch-codex.sh
          lipo -info build-cache/codex
          build-cache/codex --version

      - name: Build Framecraft.app + DMG (universal)
        run: VERSION="1.0.${{ github.run_number }}" BUILD_NUMBER="${{ github.run_number }}" scripts/build-app.sh

      - name: Bundled Codex works
        run: |
          build/Framecraft.app/Contents/MacOS/codex --version
          build/Framecraft.app/Contents/MacOS/codex login status || echo "(sin sesión, esperado en CI)"

      - name: Normal launch check (quarantined, like a downloaded copy)
        run: |
          # Simulate a copy downloaded from the internet, then launch it the normal way.
          cp -R build/Framecraft.app "$RUNNER_TEMP/Framecraft.app"
          xattr -w com.apple.quarantine "0081;$(printf '%x' $(date +%s));Safari;" "$RUNNER_TEMP/Framecraft.app"
          spctl --assess --type execute -vv "$RUNNER_TEMP/Framecraft.app" || echo "Gatekeeper: not notarized (expected for ad-hoc builds)"
          xattr -dr com.apple.quarantine "$RUNNER_TEMP/Framecraft.app"
          "$RUNNER_TEMP/Framecraft.app/Contents/MacOS/Framecraft" > "$RUNNER_TEMP/launch.log" 2>&1 &
          PID=$!
          sleep 12
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::Framecraft exited during launch"; cat "$RUNNER_TEMP/launch.log"; exit 1
          fi
          osascript -e 'tell application "System Events" to get name of windows of (first process whose unix id is '"$PID"')' || true
          kill "$PID"
          echo "Framecraft launched and stayed running"

      - name: Launch check + screenshots
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          build/Framecraft.app/Contents/MacOS/Framecraft --snapshot "$RUNNER_TEMP/shots"
          ls -la "$RUNNER_TEMP/shots"
          test "$(ls "$RUNNER_TEMP/shots"/*.png | wc -l)" -ge 10

      - uses: actions/upload-artifact@v4
        with:
          name: Framecraft-macOS
          path: macos/build/*.dmg
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: Framecraft-macOS-screenshots
          path: ${{ runner.temp }}/shots/*.png
          retention-days: 14

      - name: Commit screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        working-directory: .
        run: |
          mkdir -p docs/macos
          for f in "$RUNNER_TEMP"/shots/*.png; do
            sips --resampleWidth 1440 "$f" --out "docs/macos/$(basename "$f")" >/dev/null || cp "$f" docs/macos/
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/macos
          git commit -m "Update macOS screenshots" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/mac-v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: macos/build/*.dmg
