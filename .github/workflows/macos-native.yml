# Native macOS app (Swift / SwiftUI): tests, universal build, DMG and screenshots.
# Download the DMG from the run's "Artifacts" (Framecraft-macOS).
# Run it manually with "screenshots" checked to commit fresh screenshots to docs/macos/.
name: macOS app (Swift)

on:
  push:
    branches: ["**"]
    tags: ["mac-v*"]
    paths:
      - "macos/**"
      - ".github/workflows/macos-native.yml"
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Commit screenshots to docs/macos"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test & package
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Unit tests (core)
        run: swift test

      - name: Download Codex CLI (bundled for ChatGPT sign-in)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          scripts/fetch-codex.sh
          lipo -info build-cache/codex
          build-cache/codex --version

      # Developer ID signing — active only when these repository secrets exist:
      #   MACOS_CERTIFICATE_P12 (base64 of the .p12), MACOS_CERTIFICATE_PASSWORD,
      #   MACOS_SIGN_IDENTITY ("Developer ID Application: Name (TEAMID)").
      - name: Import Developer ID certificate
        id: signing
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$P12" ] || [ -z "$IDENTITY" ]; then
            echo "Sin certificado: se firma ad-hoc (macOS pedirá autorizar la primera apertura)."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build Framecraft.app + DMG (universal)
        env:
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: VERSION="1.0.${{ github.run_number }}" BUILD_NUMBER="${{ github.run_number }}" scripts/build-app.sh

      # Notarization — active only with an App Store Connect API key:
      #   APPLE_API_KEY_P8 (contents of the .p8), APPLE_API_KEY_ID, APPLE_API_ISSUER_ID.
      - name: Notarize and staple
        if: steps.signing.outputs.identity != ''
        env:
          KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$KEY_P8" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER" ]; then
            echo "::warning::Firmada con Developer ID pero sin notarizar (faltan los secretos APPLE_API_*)."
            exit 0
          fi
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          DMG="$(ls build/*.dmg)"
          xcrun notarytool submit "$DMG" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$KEY_ID" --issuer "$ISSUER" --wait --timeout 30m
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          rm "$RUNNER_TEMP/AuthKey.p8"
          spctl --assess --type open --context context:primary-signature -vv "$DMG"

      - name: Bundled Codex works
        run: |
          build/Framecraft.app/Contents/MacOS/codex --version
          build/Framecraft.app/Contents/MacOS/codex login status || echo "(sin sesión, esperado en CI)"

      - name: Still opens on macOS 14 and 15 (Apple Intelligence weak-linked)
        run: |
          BIN=build/Framecraft.app/Contents/MacOS/Framecraft
          lipo -info "$BIN"
          vtool -show-build "$BIN" | grep -iE 'minos|platform' || true
          otool -l "$BIN" | grep -B2 'FoundationModels' || echo "FoundationModels not linked"
          if otool -l "$BIN" | grep -B2 'FoundationModels' | grep -q 'cmd LC_LOAD_DYLIB'; then
            echo "::error::FoundationModels must be weak-linked or the app will not open before macOS 26"; exit 1
          fi

      - name: Normal launch check (quarantined, like a downloaded copy)
        run: |
          # Simulate a copy downloaded from the internet, then launch it the normal way.
          cp -R build/Framecraft.app "$RUNNER_TEMP/Framecraft.app"
          xattr -w com.apple.quarantine "0081;$(printf '%x' $(date +%s));Safari;" "$RUNNER_TEMP/Framecraft.app"
          spctl --assess --type execute -vv "$RUNNER_TEMP/Framecraft.app" || echo "Gatekeeper: not notarized (expected for ad-hoc builds)"
          xattr -dr com.apple.quarantine "$RUNNER_TEMP/Framecraft.app"
          "$RUNNER_TEMP/Framecraft.app/Contents/MacOS/Framecraft" > "$RUNNER_TEMP/launch.log" 2>&1 &
          PID=$!
          sleep 12
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::Framecraft exited during launch"; cat "$RUNNER_TEMP/launch.log"; exit 1
          fi
          osascript -e 'tell application "System Events" to get name of windows of (first process whose unix id is '"$PID"')' || true
          kill "$PID"
          echo "Framecraft launched and stayed running"

      - name: Launch check + screenshots
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          build/Framecraft.app/Contents/MacOS/Framecraft --snapshot "$RUNNER_TEMP/shots"
          ls -la "$RUNNER_TEMP/shots"
          test "$(ls "$RUNNER_TEMP/shots"/*.png | wc -l)" -ge 10

      - uses: actions/upload-artifact@v4
        with:
          name: Framecraft-macOS
          path: macos/build/*.dmg
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: Framecraft-macOS-screenshots
          path: ${{ runner.temp }}/shots/*.png
          retention-days: 14

      - name: Commit screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        working-directory: .
        run: |
          mkdir -p docs/macos
          for f in "$RUNNER_TEMP"/shots/*.png; do
            sips --resampleWidth 1440 "$f" --out "docs/macos/$(basename "$f")" >/dev/null || cp "$f" docs/macos/
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/macos
          git commit -m "Update macOS screenshots" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/mac-v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: macos/build/*.dmg
